name: Android APK Build & Release

on:
  push:
    branches: [ "main", "master", "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Signed APK & Run Protocol Verification Tests
        run: ./build-apk.sh

      - name: Upload Signed APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WifiTalkie-apk
          path: |
            WifiTalkie.apk
            releases/WifiTalkie-v1.0.0.apk

      - name: Publish or Update v1.0.0 GitHub Release with Signed APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" WifiTalkie.apk releases/WifiTalkie-v1.0.0.apk --clobber
            gh release edit "$TAG_NAME" --draft=false
          else
            gh release create "$TAG_NAME" WifiTalkie.apk releases/WifiTalkie-v1.0.0.apk \
              --title "WifiTalkie v1.0.0 — Local Wi-Fi Walkie-Talkie (OLED Liquid Glass)" \
              --notes "Download **WifiTalkie-v1.0.0.apk** below to install on Android 8.0+ (API 26–34)."
          fi
