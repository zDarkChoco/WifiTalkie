name: Android APK Build & Test

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Signed APK & Run Protocol Verification Tests
        run: ./build-apk.sh

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WifiTalkie-apk
          path: |
            WifiTalkie.apk
            releases/WifiTalkie-v1.0.0.apk
